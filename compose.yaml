# wedding site behind Caddy (automatic HTTPS) on a dedicated LAN IP (macvlan).
# Values come from deploy/truenas/deploy.env (see deploy.env.example); render with:
#   docker compose --env-file deploy/truenas/deploy.private.env config
name: wedding

services:
  wedding:
    image: wedding:${APP_TAG:?set APP_TAG}
    restart: unless-stopped
    user: "568:568"          # the TrueNAS "apps" user; ${APP_DIR}/data must be owned by it
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${APP_DIR:?set APP_DIR}/wedding.env
    volumes:
      - ${APP_DIR}/data:/data                    # SQLite database: snapshot this dataset
      - ${APP_DIR}/content:/content:ro           # private overlay (texts, photos)
      - static:/app/static_root
    networks:
      - internal
      - egress                                   # outbound SMTP

  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    depends_on:
      wedding:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ${APP_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DIR}/caddy:/data                   # certificates and ACME account
    networks:
      internal: {}
      lan:
        ipv4_address: ${LAN_IP:?set LAN_IP}

networks:
  # No gateway on "internal": the only default route of Caddy is the LAN router (via macvlan), so replies to
  # internet clients leave through the right interface.
  internal:
    internal: true
  egress: {}
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT:?set LAN_PARENT}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?set LAN_SUBNET}
          gateway: ${LAN_GATEWAY:?set LAN_GATEWAY}

volumes:
  static: {}
