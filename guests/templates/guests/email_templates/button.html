{# Call-to-action button. Usage: {% include "guests/email_templates/button.html" with url=... label=... %} #}
<table border="0" cellpadding="0" cellspacing="0" align="center">
    <tbody>
    <tr>
        <td align="center" style="padding: 20px 0 0 0;">
            <a href="{{ url }}" target="_blank"
               style="font-size: 18px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; border-radius: 3px; background-color: #337ab7; border-top: 12px solid #337ab7; border-bottom: 12px solid #337ab7; border-left: 20px solid #337ab7; border-right: 20px solid #337ab7; display: inline-block;">
                {{ label }}
            </a>
        </td>
    </tr>
    </tbody>
</table>
